<!-- COMPLETE AETHERPUNK INSTRUMENT PANEL - REPLACE YOUR result-grid -->
<div id="resultData" class="instrument-panel">
  <!-- Needle Gauges + Live Readouts -->
  <div class="gauge-row">
    <div class="analog-gauge" data-value="0.97">
      <div class="needle" style="--angle: 324deg;"></div>
      <span class="gauge-label">ID CONFIDENCE</span>
      <span class="gauge-value">97%</span>
    </div>
    <div class="analog-gauge phi-gauge" data-value="1.23e-14">
      <div class="needle phi-needle" style="--angle: 72deg;"></div>
      <span class="gauge-label">Φ<sub>ESK</sub></span>
      <span class="gauge-value">1.23×10<sup>-14</sup></span>
    </div>
  </div>

  <!-- Live Specimen Readout -->
  <div class="specimen-card">
    <div class="specimen-header">
      <span class="rarity-badge rare">★ RARE ★</span>
      <span class="value-estimate">$80K–$300K</span>
    </div>
    <div class="specimen-details">
      <div class="detail-row">
        <span class="label">Year:</span>
        <span class="value">1943 <em>(Copper Error)</em></span>
      </div>
      <div class="detail-row">
        <span class="label">Mint:</span>
        <span class="value">P <em>(Philadelphia)</em></span>
      </div>
      <div class="detail-row">
        <span class="label">Errors:</span>
        <span class="value">Copper Planchet, Double Die</span>
      </div>
    </div>
  </div>

  <!-- ESQET Coherence Waveform -->
  <canvas id="coherenceWave" class="waveform" width="300" height="80"></canvas>
  
  <!-- Φ-LUCA Action Forge -->
  <div class="action-forge">
    <button class="forge-btn ingest">🔮 Ingest to Φ-LUCA Memory</button>
    <button class="forge-btn preserve">🛡️ Preservation Guide</button>
    <button class="forge-btn market">💰 Market Comps</button>
    <button class="forge-btn companion">🤖 Ask Φ-LUCA</button>
  </div>
</div>
