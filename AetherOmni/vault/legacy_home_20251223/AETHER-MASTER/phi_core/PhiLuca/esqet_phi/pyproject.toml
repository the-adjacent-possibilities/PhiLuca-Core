[project]
name = "esqet_phi"
version = "1.0.0"
description = "Emergent Spacetime Quantum Entanglement Theory Physics Core"
authors = [{name = "Marco António Rocha", email = "your@email.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "torch>=2.0",
    "matplotlib>=3.5",
    "scipy>=1.8",
]

[project.optional-dependencies]
dev = ["pytest", "black", "isort"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["esqet_phi"]

